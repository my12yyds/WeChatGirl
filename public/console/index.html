<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>WeChatGirl · 微信助手</title>
  <script src="/theme-init.js"></script>
  <script src="/color-theme.js"></script>
  <link rel="icon" href="/app-icon.png" type="image/png">
  <link rel="stylesheet" href="/console.css">
  <link rel="stylesheet" href="/music.css">
  <link rel="stylesheet" href="/send-mode.css">
  <link rel="stylesheet" href="/workspace-layout.css">
  <link rel="stylesheet" href="/appearance.css">
  <link rel="stylesheet" href="/process-recovery.css">
  <link rel="stylesheet" href="/extension-market.css">
  <link rel="stylesheet" href="/plugins.css">
  <link rel="stylesheet" href="/sticker-manager.css">
  <link rel="stylesheet" href="/session-groups.css">
  <link rel="stylesheet" href="/persona-categories.css">
  <link rel="stylesheet" href="/memory-view.css">
  <link rel="stylesheet" href="/memory-constellation.css">
  <link rel="stylesheet" href="/fish-notebook.css">
  <link rel="stylesheet" href="/ui-polish.css">
  <link rel="stylesheet" href="/persona-studio.css">
  <link rel="stylesheet" href="/redesign.css">
<script src="/console.js" type="module"></script>
</head>
<body>
  <div class="app-background" id="app-background" aria-hidden="true"></div>
  <a href="#content" class="skip-link">跳到内容</a>
  <aside class="sidebar" id="sidebar">
    <div class="brand"><img src="/app-icon.png" alt="" width="34" height="34"><div><strong>WeChatGirl</strong><span>微信助手</span></div><button id="sidebar-close" class="icon-button" type="button" aria-label="关闭导航"><svg><use href="/icons.svg#close"></use></svg></button></div>
    <div class="nav-caption">你的工作空间</div>
    <nav aria-label="主导航">
      <a href="#setup" data-page="setup" id="setup-nav" hidden><svg><use href="/icons.svg#plug"></use></svg><span>配置向导</span></a>
      <a href="#overview" data-page="overview"><svg><use href="/icons.svg#dashboard"></use></svg><span>工作台</span></a>
      <a href="#chats" data-page="chats"><svg><use href="/icons.svg#users"></use></svg><span>聊天</span><span class="nav-count" id="nav-chat-count">—</span></a>
      <a href="#roles" data-page="roles"><svg><use href="/icons.svg#person"></use></svg><span>人格</span></a>
      <a href="#extensions" data-page="extensions"><svg><use href="/icons.svg#plug"></use></svg><span>能力</span></a>
      <a href="#plugins" data-page="plugins"><svg><use href="/icons.svg#puzzle"></use></svg><span>插件与聊天</span></a>
      <a href="#music" data-page="music"><svg><use href="/icons.svg#music"></use></svg><span>音乐</span></a>
      <a href="#voice" data-page="voice"><svg><use href="/icons.svg#voice-studio"></use></svg><span>语音音色</span></a>
      <a href="#sending" data-page="sending"><svg><use href="/icons.svg#send"></use></svg><span>发送模式</span></a>
      <a href="#stickers" data-page="stickers"><svg><use href="/icons.svg#image"></use></svg><span>表情包</span></a>
      <a href="#memory" data-page="memory"><svg><use href="/icons.svg#history"></use></svg><span>记忆</span></a>
      <a href="#constellation" data-page="constellation"><svg><use href="/icons.svg#constellation"></use></svg><span>记忆星图</span></a>
      <a href="#settings" data-page="settings"><svg><use href="/icons.svg#sliders"></use></svg><span>设置</span></a>
    </nav>
    <div class="sidebar-bottom"><div class="local-label"><svg><use href="/icons.svg#shield"></use></svg><span>仅在本机访问</span></div><span class="version">WeChatGirl / 0.5.10</span><button class="link-button" id="check-updates">检查更新</button><button class="link-button quit-console" id="quit-console">退出控制台</button></div>
  </aside>
  <div class="workspace">
    <header class="topbar"><div class="breadcrumb"><button class="icon-button mobile-menu" id="menu-button" aria-label="打开导航" aria-expanded="false" aria-controls="sidebar"><svg><use href="/icons.svg#menu"></use></svg></button><span class="console-label">控制台</span><span class="separator">/</span><strong id="breadcrumb-page">工作台</strong></div><div class="topbar-actions"><a class="connection-label" id="connection-label" href="#overview" title="查看服务与连接状态" aria-label="正在连接本机控制台"><i class="dot"></i><span>连接中</span></a><span class="topbar-divider" aria-hidden="true"></span><button class="icon-button" id="activity-button" aria-label="查看上次操作结果" title="查看操作结果" hidden><svg><use href="/icons.svg#history"></use></svg></button><button class="icon-button" id="refresh-button" aria-label="刷新当前页面" title="刷新"><svg><use href="/icons.svg#refresh"></use></svg></button><button class="button appearance-trigger" id="appearance-button" aria-label="自定义颜色与背景" title="自定义颜色与背景"><svg><use href="/icons.svg#image"></use></svg><span>外观</span></button><details class="action-menu topbar-more"><summary class="button" aria-label="外观与更多选项">更多</summary><div><button class="button" data-action="start">一键启动</button><button class="button" data-action="restart">重启服务</button><button class="button" data-restart-app>重启程序</button><button class="icon-button" id="theme-button" aria-label="切换深色主题" title="切换主题"><svg><use href="/icons.svg#moon"></use></svg></button><a class="button" href="#settings/appearance">外观与数据设置</a></div></details></div></header>
    <main id="content" tabindex="-1">
      <div id="connection-error" class="notice error-notice" hidden role="alert"></div>
      <div class="page-heading"><div><button class="button small" id="page-back" type="button">← 返回上一页</button><h1 id="page-title">工作台</h1><p id="page-description">对话、陪伴与灵感，从这里开始。</p></div><span class="subtle" id="updated-label"></span></div>
      <div id="pending-banner" class="notice" hidden><svg><use href="/icons.svg#info"></use></svg><span id="pending-message">设置已保存，重启服务后生效。</span><button class="button small" data-action="restart">重启并应用</button></div>
      <div id="setup-banner" class="notice" hidden><svg><use href="/icons.svg#info"></use></svg><span>继续配置微信、模型与允许的聊天，完成后即可开始对话。</span><a class="button small" href="#setup">开始配置</a></div>
      <div id="update-banner" class="notice" hidden role="status"><span id="update-message"></span><div class="button-row" id="update-download" aria-label="更新下载来源"></div><a class="text-link" id="update-notes" target="_blank" rel="noopener noreferrer">发布说明</a><button class="button small" id="dismiss-update">稍后</button></div>
      <div id="page-body"><div class="loading-state">正在连接本机控制台…</div></div>
    </main>
    <div class="save-bar" id="save-bar" hidden><div><strong>有未保存的设置</strong><span>表情、网页阅读、联网、主动聊天与上下文设置保存后生效，其他设置需重启服务。</span></div><div class="button-row"><button class="button" id="discard-button">放弃更改</button><button class="button primary" id="save-button">保存设置</button></div></div>
  </div>
  <dialog id="modal" aria-labelledby="modal-title"><div class="modal-header"><h2 id="modal-title"></h2><button class="icon-button" id="modal-close" aria-label="关闭窗口"><svg><use href="/icons.svg#close"></use></svg></button></div><div id="modal-content"></div></dialog>
  <div class="toast" id="toast" role="status" hidden></div>
  <section class="job-panel" id="job-panel" hidden aria-label="操作进度"><div class="job-header"><div><i id="job-dot" class="dot"></i><strong id="job-title">正在操作</strong></div><button class="icon-button" id="job-close" aria-label="收起操作进度"><svg><use href="/icons.svg#close"></use></svg></button></div><p id="job-description"></p><pre id="job-output" tabindex="0"></pre><div class="job-footer"><span id="job-state"></span><div class="button-row"><button class="button small" id="job-recovery" hidden>检查占用进程</button><button class="button small" id="job-retry" hidden>重试</button></div></div></section>
</body>
</html>
